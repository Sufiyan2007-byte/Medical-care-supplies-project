services:
  # Express API Server
  - type: web
    name: medical-website-api
    env: node
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medical-website-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@medportal.com

databases:
  # Managed PostgreSQL Database
  - name: medical-website-db
    databaseName: medical_website
    user: medical_user
    region: oregon
